name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      FOUNDATION_ID: ${{ secrets.FOUNDATION_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      ORG_SEARCH_TERM: ${{ secrets.ORG_SEARCH_TERM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Capture admin session
        run: npm run auth:admin

      # USER_EMAIL/USER_PASSWORD are optional: TC12 (tests/e2e/permissions.spec.ts)
      # self-skips when playwright/.auth/user.json wasn't produced.
      - name: Capture user session
        run: npm run auth:user
        continue-on-error: true

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
